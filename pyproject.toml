[project]
name = "lfox"
version = "0.1.0"
description = 'Lattice Fields Over jaX'
readme = "README.md"
license = "MIT"
authors = [
  { name = "Ethan Neil", email = "ethan.neil@colorado.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.12.2",
    "jax>=0.6.0",
    "jupyter>=1.1.1",
    "lsqfit>=13.3",
    "matplotlib>=3.10.3",
    "ml-dtypes>=0.5.1",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
metal = [
    "jax-metal>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
