[project]
name = "lfox"
version = "0.0.1"
description = 'Lattice Fields Over jaX'
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Ethan Neil", email = "ethan.neil@colorado.edu" },
]
keywords = [
  "lattice field theory",
  "lattice qcd",
  "hybrid monte carlo",
  "jax",
  "physics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.7",
    "jax>=0.10.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/etneil/lfox"
Repository = "https://github.com/etneil/lfox"
Issues = "https://github.com/etneil/lfox/issues"

[project.optional-dependencies]
mps = [
    "jax-mps>=0.10.10",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

# Development-only dependencies. These are *not* published as part of the
# distribution -- they support the tests and the exploratory notebooks at the
# repo root, neither of which ship to PyPI.
[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "notebooks" },
]
test = [
    "pytest>=8.0",
]
notebooks = [
    "gvar>=13.1",
    "jupyter>=1.1.1",
    "jupytext>=1.19.4",
    "lsqfit>=13.3",
    "matplotlib>=3.10.3",
    "tqdm>=4.67.1",
]

# Named publish target for *local* release dry runs: `uv publish --index testpypi`.
# CI does not use this -- the publish job passes --publish-url explicitly, since it
# runs without a checkout. `explicit` keeps this out of dependency resolution.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.jupytext]
formats = "ipynb,py:percent"
