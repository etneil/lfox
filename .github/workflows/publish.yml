name: Publish

# Publishes to PyPI when a GitHub Release is published, and to TestPyPI on demand
# (Actions -> Publish -> Run workflow). Authentication is via PyPI Trusted
# Publishing (OIDC) -- there are no API tokens stored in this repository.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version: setup-uv does not publish a floating `v9` tag.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked --no-default-groups --group test pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the one configured on the trusted publisher.
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to an exact version: setup-uv does not publish a floating `v9` tag.
      # enable-cache must be off: this job deliberately does not check out the
      # repository, so setup-uv's default `auto` cache finds no pyproject.toml /
      # uv.lock to key on and fails. Nothing is installed here anyway -- the job
      # only needs the uv binary to upload the already-built artifact.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      # The publish URL is given explicitly rather than via `--index testpypi`,
      # because that flag resolves the name from pyproject.toml, which is not
      # present without a checkout. Keeping repository source out of the one job
      # holding `id-token: write` means nothing in the repo can influence the
      # step that mints a PyPI credential.
      - name: Publish
        env:
          TARGET: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
        run: |
          if [ "$TARGET" = "testpypi" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/
          else
            uv publish
          fi
